
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Categoria</title>
</head>
<body>

<h1>Sistema de Biblioteca</h1>
<h2>Cadastrar Categoria</h2>

<nav>
    <a th:href="@{/livros}">Início</a>
    |
    <a th:href="@{/livros/categorias/listarCategorias}">
        Listar Categorias
    </a>
</nav>

<hr>

<h3>Nova Categoria</h3>

<form th:action="@{/livros/categorias/salvar}"
      th:object="${categoria}"
      method="post">
    <!--/*@thymesVar id="categoria" type="com.ger.biblioteca.biblioteca.model.Categoria"*/-->
    <label for="id">ID da Categoria:</label>
    <input type="number"
           id="id"
           th:field="*{id}"
           min="1"
           required>

    <br><br>

    <label for="nome">Nome da Categoria:</label>
    <input type="text"
           id="nome"
           th:field="*{nome}"
           required>

    <br><br>

    <button type="submit">Cadastrar Categoria</button>

</form>

</body>
</html>
