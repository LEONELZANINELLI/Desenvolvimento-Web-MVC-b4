
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${indice != null} ? 'Editar Categoria' : 'Cadastrar Categoria'">Cadastrar Categoria</title>
</head>
<body>

<h1>Sistema de Biblioteca</h1>
<h2 th:text="${indice != null} ? 'Editar Categoria' : 'Cadastrar Categoria'">Cadastrar Categoria</h2>

<nav>
    <a th:href="@{/livros}">Início</a>
    |
    <a th:href="@{/livros/categorias/listarCategorias}">
        Listar Categorias
    </a>
</nav>

<hr>

<h3 th:text="${indice != null} ? 'Alterar dados da categoria' : 'Nova Categoria'">Nova Categoria</h3>

<!--/* O índice seleciona a ação de edição. Cada th:field lê uma propriedade de categoria. */-->
<form th:action="${indice != null} ? @{/livros/categorias/atualizar/{indice}(indice=${indice})} : @{/livros/categorias/salvar}"
      th:object="${categoria}"
      method="post">
    <ul th:if="${#fields.hasErrors('*')}" role="alert">
        <li th:each="erro : ${#fields.errors('*')}" th:text="${erro}"></li>
    </ul>
    <!--/*@thymesVar id="categoria" type="com.ger.biblioteca.biblioteca.model.Categoria"*/-->
    <label for="id">ID da Categoria:</label>
    <input type="number"
           id="id"
           th:field="*{id}"
           min="1"
           required>

    <br><br>

    <label for="nome">Nome da Categoria:</label>
    <input type="text"
           id="nome"
           th:field="*{nome}"
           required>

    <br><br>

    <button type="submit" th:text="${indice != null} ? 'Salvar alterações' : 'Cadastrar Categoria'">Cadastrar Categoria</button>

</form>

</body>
</html>
