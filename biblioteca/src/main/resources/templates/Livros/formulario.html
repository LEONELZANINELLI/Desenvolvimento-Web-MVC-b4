
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${registroId != null} ? 'Editar Livro' : 'Cadastro de Livros'">Cadastro de Livros</title>
</head>
<body>

<h1 th:text="${registroId != null} ? 'Editar Livro' : 'Cadastro de Livros'">Cadastro de Livros</h1>

<!--/* O ID do registro seleciona a ação de atualização. Cada th:field lê uma propriedade de livro. */-->
<form th:action="${registroId != null} ? @{/livros/atualizar/{registroId}(registroId=${registroId})} : @{/livros/salvar}"
      th:object="${livro}"
      method="post">

    <ul th:if="${#fields.hasErrors('*')}" role="alert">
        <li th:each="erro : ${#fields.errors('*')}" th:text="${erro}"></li>
    </ul>

    <label for="titulo">Título:</label>
    <input type="text"
           id="titulo"
           th:field="*{titulo}"
           required>
    <br><br>

    <label for="autorId">Autor:</label>
    <select id="autorId" th:field="*{autorId}" th:required="${autorAnterior == null}">
        <option value="" th:text="${autorAnterior != null} ? 'Manter autor atual' : 'Selecione um autor'">Selecione um autor</option>
        <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nome}"></option>
    </select>
    <a th:href="@{/autor/novo}">Cadastrar autor</a>
    <p th:if="${#lists.isEmpty(autores) and autorAnterior == null}">Cadastre um autor para continuar.</p>
    <p th:if="${autorAnterior != null}">Autor atual do livro: <span th:text="${autorAnterior}"></span></p>
    <br><br>

    <label for="isbn">ISBN:</label>
    <input type="text"
           id="isbn"
           th:field="*{isbn}"
           required>
    <br><br>

    <button type="submit"
            th:disabled="${#lists.isEmpty(autores) and autorAnterior == null}"
            th:text="${registroId != null} ? 'Salvar alterações' : 'Cadastrar Livro'">Cadastrar Livro</button>

</form>

<br>

<a th:href="@{/livros}">Voltar ao início</a>

</body>
</html>
