
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${indice != null} ? 'Editar Livro' : 'Cadastro de Livros'">Cadastro de Livros</title>
</head>
<body>

<h1 th:text="${indice != null} ? 'Editar Livro' : 'Cadastro de Livros'">Cadastro de Livros</h1>

<!--/* O índice seleciona a ação de edição. Cada th:field lê uma propriedade de livro. */-->
<form th:action="${indice != null} ? @{/livros/atualizar/{indice}(indice=${indice})} : @{/livros/salvar}"
      th:object="${livro}"
      method="post">

    <ul th:if="${#fields.hasErrors('*')}" role="alert">
        <li th:each="erro : ${#fields.errors('*')}" th:text="${erro}"></li>
    </ul>

    <label for="titulo">Título:</label>
    <input type="text"
           id="titulo"
           th:field="*{titulo}"
           required>
    <br><br>

    <label for="autor">Autor:</label>
    <input type="text"
           id="autor"
           th:field="*{autor}"
           required>
    <br><br>

    <label for="isbn">ISBN:</label>
    <input type="text"
           id="isbn"
           th:field="*{isbn}"
           required>
    <br><br>

    <button type="submit" th:text="${indice != null} ? 'Salvar alterações' : 'Cadastrar Livro'">Cadastrar Livro</button>

</form>

<br>

<a th:href="@{/livros}">Voltar ao início</a>

</body>
</html>
