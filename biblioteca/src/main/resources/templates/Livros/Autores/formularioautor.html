
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${indice != null} ? 'Editar Autor' : 'Cadastro de Autores'">Cadastro de Autores</title>
</head>
<body>

<h1 th:text="${indice != null} ? 'Editar Autor' : 'Cadastro de Autores'">Cadastro de Autores</h1>

<!--/* O índice seleciona a ação de edição. Cada th:field lê uma propriedade de autor. */-->
<form th:action="${indice != null} ? @{/autor/atualizar/{indice}(indice=${indice})} : @{/autor/salvar}"
      th:object="${autor}"
      method="post">

    <ul th:if="${#fields.hasErrors('*')}" role="alert">
        <li th:each="erro : ${#fields.errors('*')}" th:text="${erro}"></li>
    </ul>

    <label for="nome">Nome do Autor:</label>
    <input type="text"
           id="nome"
           th:field="*{nome}"
           required>
    <br><br>

    <label for="descricao">Descrição:</label>
    <input type="text"
           id="descricao"
           th:field="*{descricao}"
           required>
    <br><br>

    <label for="nacionalidade">Nacionalidade:</label>
    <input type="text"
           id="nacionalidade"
           th:field="*{nacionalidade}"
           required>
    <br><br>

    <button type="submit" th:text="${indice != null} ? 'Salvar alterações' : 'Cadastrar Autor'">Cadastrar Autor</button>

</form>

<br>

<a th:href="@{/autor}">
    Voltar para Autores
</a>

</body>
</html>
